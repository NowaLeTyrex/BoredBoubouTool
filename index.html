<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Bored Boubou Tool</title>
<meta name="description" content="Bored Boubou Tool — choisir une activité selon son énergie, son temps et ses envies.">
<meta name="application-name" content="Bored Boubou Tool">
<meta name="theme-color" content="#161514">
<script>
  /* Applique le thème avant le premier affichage (évite un flash de la mauvaise couleur) */
  try {
    var t = localStorage.getItem("que-faire-v2-theme") || "auto";
    if (t === "auto") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="manifest" href="boubou.webmanifest">
<link rel="icon" type="image/png" href="boubou-192.png">
<link rel="apple-touch-icon" href="boubou-192.png">
<style>
:root {
  --bg: #161514; --surface: #211f1d; --surface2: #2b2825; --border: #3a3632;
  --text: #ece7e1; --dim: #9d958c; --accent: #e07a5f; --accent-soft: rgba(224,122,95,.16);
  --on-accent: #1f120d; --green: #81b29a; --green-soft: rgba(129,178,154,.16);
  --red: #e76f6f; --red-soft: rgba(231,111,111,.13); --amber: #f2cc8f; --amber-soft: rgba(242,204,143,.13);
  --accent-text: #e07a5f; --blue: #8fb4e0; --backdrop: rgba(0,0,0,.58); --shadow: rgba(0,0,0,.45);
  --toast-bg: #f1ece6; --toast-fg: #1a1714; --toast-accent: #b24a2f;
  --serif: Georgia, "Noto Serif", "Droid Serif", serif;
  --sans: system-ui, Roboto, "Segoe UI", sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f6f2ec; --surface: #ffffff; --surface2: #f0eae3; --border: #ded5cb;
  --text: #241f1b; --dim: #6c635a; --accent: #e07a5f; --accent-soft: rgba(224,122,95,.15); --accent-text: #b04b35;
  --on-accent: #1f120d; --green: #3a8460; --green-soft: rgba(58,132,96,.12);
  --red: #c04343; --red-soft: rgba(192,67,67,.09); --amber: #94640f; --amber-soft: rgba(196,140,40,.15);
  --blue: #36689f; --backdrop: rgba(30,24,20,.38); --shadow: rgba(60,40,20,.16);
  --toast-bg: #2b2622; --toast-fg: #f4efe9; --toast-accent: #f3a58f;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; overscroll-behavior: none; }
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
input, textarea { font: inherit; color: inherit; }
ul { list-style: none; }

.app { display: flex; flex-direction: column; height: 100dvh; max-width: 560px; margin: 0 auto; }
.main { flex: 1; overflow-y: auto; padding: calc(env(safe-area-inset-top) + 14px) 16px 16px; position: relative; }
.screen { display: flex; flex-direction: column; gap: 12px; min-height: 100%; }

.top { display: flex; align-items: baseline; gap: 10px; padding: 2px 2px 2px; }
.top h1 { font-family: var(--serif); font-size: 28px; font-weight: 700; letter-spacing: -.3px; }
.top .accent { color: var(--accent-text); }
.muted { color: var(--dim); font-weight: 500; }
.small { font-size: 13px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
.card-label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 10px; min-height: 22px; }
.card-label .muted { text-transform: none; letter-spacing: 0; font-size: 13px; }
.card-label .end { margin-left: auto; }
.badge { background: var(--accent-soft); color: var(--accent-text); border-radius: 10px; padding: 1px 8px; font-size: 12px; letter-spacing: 0; }

.energy { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.energy-btn { height: 52px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--border); font-size: 22px; filter: grayscale(1); opacity: .5; transition: all .15s; }
.energy-btn.on { background: var(--accent-soft); border-color: var(--accent); filter: none; opacity: 1; }

.scroll-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px; }
.scroll-row.edge { margin: 0 -16px; padding: 0 16px; }
.scroll-row::-webkit-scrollbar { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { flex: none; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--border); background: var(--surface2); color: var(--dim); font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.chip.ghost { border-style: dashed; background: none; }

.tag-chip { height: 36px; padding: 0 13px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface2); color: var(--dim); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.tag-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, #9aa0a6); flex: none; }
.tag-chip.inc { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.tag-chip.exc { background: var(--red-soft); border-color: var(--red); color: var(--red); text-decoration: line-through; }

.link { color: var(--accent-text); font-weight: 600; font-size: 13px; padding: 4px 2px; text-transform: none; letter-spacing: 0; }

.btn { height: 46px; padding: 0 18px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--border); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .1s; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { background: var(--red-soft); border-color: color-mix(in srgb, var(--red) 40%, transparent); color: var(--red); }
.btn.full { width: 100%; }
.btn.big { height: 56px; font-size: 17px; width: 100%; }
.btn.small { height: 34px; padding: 0 12px; font-size: 13px; }

.roll-bar { position: sticky; bottom: -16px; margin: auto -16px -16px; padding: 14px 16px 16px; background: linear-gradient(transparent, var(--bg) 14px); z-index: 2; }
.roll { width: 100%; height: 62px; border-radius: 16px; flex-direction: column; gap: 1px; font-size: 18px; line-height: 1.15; box-shadow: 0 6px 18px var(--shadow); }
.roll small { font-size: 12.5px; font-weight: 500; opacity: .75; }
.roll-hint { text-align: center; font-size: 13px; color: var(--dim); margin-bottom: 8px; }

.pick-list { margin-top: 2px; }
.pick-item { display: flex; width: 100%; align-items: center; gap: 10px; padding: 11px 2px; border-top: 1px solid var(--border); text-align: left; }
.pick-item .grow { flex: 1; min-width: 0; }
.pick-item .name { font-weight: 600; overflow-wrap: anywhere; }
.pick-item .meta { font-size: 12.5px; color: var(--dim); }

.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0 12px; height: 48px; }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: 16px; }
.search .ico { color: var(--dim); }

.list { display: flex; flex-direction: column; gap: 8px; }
.pad-fab { padding-bottom: 84px; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; min-height: 58px; }
.row:active { background: var(--surface2); }
.row.off { opacity: .55; }
.row.danger-row { color: var(--red); }
.row-ico { font-size: 20px; width: 26px; text-align: center; flex: none; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 700; font-size: 15.5px; overflow-wrap: anywhere; }
.row-meta { font-size: 13px; color: var(--dim); margin-top: 2px; line-height: 1.35; }
.row-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.mini-tag { font-size: 11.5px; padding: 2px 8px; border-radius: 9px; background: var(--surface2); color: var(--dim); border-left: 3px solid var(--c, #9aa0a6); }
.stars { color: var(--amber); margin-left: 6px; font-size: 13px; }
.chev { color: var(--dim); font-size: 20px; flex: none; }
.pill { flex: none; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 10px; white-space: nowrap; }
.pill.blocked { background: var(--amber-soft); color: var(--amber); }
.pill.off { background: var(--surface2); color: var(--dim); }
.tag-dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }

.fab { position: fixed; right: max(16px, calc((100vw - 560px) / 2 + 16px)); bottom: calc(env(safe-area-inset-bottom) + 86px); width: 58px; height: 58px; border-radius: 18px; background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 20px var(--shadow); display: flex; align-items: center; justify-content: center; z-index: 5; }
.fab .ico svg { width: 26px; height: 26px; }

.empty { text-align: center; color: var(--dim); padding: 32px 16px; border: 1px dashed var(--border); border-radius: 16px; font-size: 14.5px; line-height: 1.5; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 12px 2px -2px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.text { line-height: 1.5; color: var(--text); }
.hint { font-size: 13px; color: var(--dim); margin-top: 6px; line-height: 1.4; }
.center { text-align: center; }
.footer-note { text-align: center; font-size: 12.5px; color: var(--dim); padding: 18px 0 8px; line-height: 1.5; }

.install { display: flex; align-items: center; gap: 12px; background: var(--accent-soft); border: 1px solid rgba(224,122,95,.4); border-radius: 14px; padding: 10px 10px 10px 14px; font-size: 14px; }
.install span { flex: 1; }

.nav { display: flex; border-top: 1px solid var(--border); background: var(--surface); padding-bottom: env(safe-area-inset-bottom); flex: none; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 9px; font-size: 12px; font-weight: 600; color: var(--dim); }
.nav-ico { padding: 3px 18px; border-radius: 15px; display: flex; transition: background .15s; }
.nav-btn.on { color: var(--text); }
.nav-btn.on .nav-ico { background: var(--accent-soft); color: var(--accent-text); }
.ico { display: inline-flex; }
.ico svg { width: 22px; height: 22px; }

/* Feuilles (bottom sheets) */
.sheet-backdrop { position: fixed; inset: 0; background: var(--backdrop); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .18s; }
.sheet { width: 100%; max-width: 560px; max-height: 92dvh; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-bottom: 0; border-radius: 22px 22px 0 0; animation: sheet-in .3s cubic-bezier(.2,.85,.25,1); padding-bottom: env(safe-area-inset-bottom); will-change: transform; }
.sheet-grab { flex: none; touch-action: none; cursor: grab; }
.sheet-handle { height: 22px; display: flex; align-items: center; justify-content: center; }
.sheet-handle::before { content: ""; width: 40px; height: 4px; border-radius: 2px; background: var(--border); }
.sheet-head { display: flex; align-items: center; padding: 4px 8px 2px 20px; flex: none; }
.sheet-head h2 { flex: 1; font-family: var(--serif); font-size: 21px; }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; color: var(--dim); font-size: 18px; }
.sheet-body { overflow-y: auto; padding: 10px 20px 20px; display: flex; flex-direction: column; gap: 18px; overscroll-behavior: contain; }
.sheet-foot { display: flex; gap: 10px; padding: 12px 20px 14px; border-top: 1px solid var(--border); flex: none; }
.sheet-foot .btn { flex: 1; }
@keyframes up { from { transform: translateY(40px); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
@keyframes sheet-in { from { transform: translateY(100%); } }
.sheet-backdrop.closing { pointer-events: none; opacity: 0; transition: opacity .2s ease-in; }
.sheet-backdrop.closing .sheet { transform: translateY(105%) !important; transition: transform .2s ease-in !important; }

.field-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); margin-bottom: 8px; }
.sub-label { font-size: 13px; font-weight: 600; color: var(--dim); margin: 12px 0 8px; }
.input { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface2); font-size: 16px; outline: 0; }
.input:focus { border-color: var(--accent); }
textarea.input { height: 200px; padding: 12px; resize: vertical; font-family: ui-monospace, monospace; font-size: 13px; }
.dur { display: flex; flex-direction: column; gap: 10px; }
.input.num { width: 120px; }
.add-row { display: flex; gap: 8px; margin-top: 10px; }
.add-row .input { flex: 1; min-width: 0; }

.seg { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; min-height: 40px; padding: 4px 2px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--dim); line-height: 1.15; }
.seg button.on { background: var(--accent-soft); color: var(--text); box-shadow: inset 0 0 0 1px var(--accent); }

.switch-row { display: flex; align-items: center; justify-content: space-between; min-height: 44px; font-weight: 600; }
.switch { appearance: none; -webkit-appearance: none; width: 52px; height: 30px; border-radius: 15px; background: var(--border); position: relative; transition: background .2s; flex: none; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch:checked { background: var(--green); }
.switch:checked::after { transform: translateX(22px); }
.blocked-box { display: flex; align-items: center; gap: 10px; justify-content: space-between; background: var(--amber-soft); border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent); color: var(--amber); border-radius: 12px; padding: 10px 10px 10px 14px; font-size: 14px; font-weight: 600; margin-top: 10px; }

.palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; justify-items: center; }
.swatch { width: 46px; height: 46px; border-radius: 50%; border: 3px solid transparent; box-shadow: inset 0 0 0 3px var(--surface); }
.swatch.on { border-color: var(--text); }

.result { text-align: center; display: flex; flex-direction: column; gap: 12px; padding: 4px 0 2px; }
.result-kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--accent-text); }
.result-name { font-family: var(--serif); font-size: 32px; font-weight: 700; line-height: 1.12; overflow-wrap: anywhere; min-height: 72px; display: flex; align-items: center; justify-content: center; }
.result-name.rolling { opacity: .55; }
.result-meta { color: var(--dim); font-size: 14px; }
.result .row-tags { justify-content: center; margin-top: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.toast-wrap { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 156px); display: flex; justify-content: center; padding: 0 16px; z-index: 100; pointer-events: none; }
.toast { pointer-events: auto; width: 100%; max-width: 528px; background: var(--toast-bg); color: var(--toast-fg); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; font-size: 14.5px; font-weight: 500; box-shadow: 0 8px 24px var(--shadow); animation: up .2s; position: relative; overflow: hidden; }
.toast button { margin-left: auto; font-weight: 800; color: var(--toast-accent); padding: 4px 6px; flex: none; }
.energy.inherit .energy-btn.on { border-style: dashed; opacity: .75; }
.row.compact { min-height: 50px; padding: 10px 12px; }
.sheet .row { background: var(--surface2); }
.row-subs { font-size: 12.5px; color: var(--dim); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill.todo { background: var(--surface2); color: var(--dim); box-shadow: inset 0 0 0 1px var(--border); }
.pill.doing { background: rgba(122,165,216,.16); color: var(--blue); }
.pill.done { background: var(--green-soft); color: var(--green); }
.sub-pick { display: flex; flex-direction: column; text-align: left; border-bottom: 1px solid var(--border); }
.result-name.medium { font-size: 26px; min-height: 0; }
.result-status .seg button { font-size: 13px; }
.pin-bar { display: flex; align-items: center; flex: none; background: var(--surface2); border-top: 1px solid var(--border); box-shadow: inset 3px 0 0 var(--accent); padding-right: 2px; }
.pin-bar[hidden] { display: none; }
.pin-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 7px 4px 7px 14px; min-height: 52px; text-align: left; }
.pin-main:active { background: var(--surface); }
.pin-ico { font-size: 17px; flex: none; }
.pin-text { display: flex; flex-direction: column; min-width: 0; }
.pin-name { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pin-meta { font-size: 12px; color: var(--dim); }
body.has-pin .fab { bottom: calc(env(safe-area-inset-bottom) + 139px); }
body.has-pin .toast-wrap { bottom: calc(env(safe-area-inset-bottom) + 209px); }

/* --- Finitions --- */
button, .chip, .tag-chip, .row, .nav-btn { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.chip, .tag-chip, .energy-btn, .seg button, .swatch, .icon-btn { transition: transform .1s, background-color .15s, border-color .15s, color .15s, opacity .15s; }
.chip:active, .tag-chip:active, .energy-btn:active, .seg button:active, .swatch:active { transform: scale(.94); }
.pick-item:active, .row:active, .pin-main:active { background: var(--surface2); }
.sheet .row:active { background: var(--border); }
.nav-btn:active .nav-ico { transform: scale(.92); }
.nav-ico { transition: background-color .15s, transform .1s; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus-visible, textarea:focus-visible { outline: none; }
.top.col { flex-direction: column; align-items: flex-start; gap: 2px; }
.top.col p { font-size: 14.5px; }
.screen.enter { animation: screen-in .22s ease-out; }
@keyframes screen-in { from { opacity: 0; } } /* pas de transform : il décalerait le bouton + (position fixe) */
.result-name.reveal { animation: reveal .32s cubic-bezier(.2,.9,.3,1.25); }
@keyframes reveal { from { transform: scale(.86); opacity: .3; } }
.toast-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--toast-accent); opacity: .6; transform-origin: left; animation: toast-time linear forwards; }
@keyframes toast-time { to { transform: scaleX(0); } }
.welcome ol { margin: 0 0 12px 20px; line-height: 1.55; font-size: 14.5px; }
.welcome { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.confetti { position: fixed; left: 50%; top: 62%; width: 0; height: 0; z-index: 120; pointer-events: none; }
.confetti i { position: absolute; width: 8px; height: 12px; border-radius: 2px; opacity: 0; animation: confetti .95s cubic-bezier(.15,.7,.3,1) forwards; }
@keyframes confetti {
  0% { opacity: 1; transform: translate(0, 0) rotate(0) scale(.6); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 120px)) rotate(var(--r)) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
.brand { display: flex; align-items: center; gap: 12px; padding: 2px 2px 4px; }
.brand img { width: 48px; height: 48px; flex: none; border-radius: 50%; }
.brand-text { min-width: 0; }
.brand h1 { font-family: var(--serif); font-size: 25px; font-weight: 700; letter-spacing: -.3px; line-height: 1.1; }
.brand p { font-size: 14px; margin-top: 2px; }
</style>
</head>
<body>
<div class="app">
  <main class="main" id="main"></main>
  <div class="pin-bar" id="pin" hidden></div>
  <nav class="nav" id="nav"></nav>
</div>
<div class="toast-wrap" id="toast"></div>
<input type="file" id="file-input" hidden>

<script>
"use strict";
/* =========================================================================
   Bored Boubou Tool (anciennement « Que faire ? »)
   Les clés de stockage gardent le préfixe « que-faire » pour conserver les données existantes.
   Application sans dépendance : tout est dans ce fichier.
   Données stockées dans le localStorage du navigateur (clé STORE_KEY).
   ========================================================================= */

/* ---------- Constantes ---------- */
const STORE_KEY = "que-faire-v2";
const FILTER_KEY = "que-faire-v2-filters";
const EXPORT_KEY = "que-faire-v2-last-export";
const BANNER_KEY = "que-faire-v2-hide-install";
const PIN_KEY = "que-faire-v2-pin"; // dernière activité validée aujourd'hui
const V1_KEY = "activities-v1"; // ancienne version : migrée automatiquement
const APP_VERSION = "2.4.2";
const THEME_KEY = "que-faire-v2-theme";
const WELCOME_KEY = "que-faire-v2-welcome-seen";
const DAY = 86400000;

const ENERGY = [null,
  { e: "🪫", l: "Très faible" }, { e: "🔋", l: "Faible" }, { e: "⚡", l: "Moyenne" },
  { e: "🔥", l: "Élevée" }, { e: "💥", l: "Intense" }];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clampInt = (v, min, max, def) => { if (v == null || v === "") return def; const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : def; };
const isColor = c => typeof c === "string" && /^#[0-9a-f]{6}$/i.test(c);

const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const plural = (n, one, many) => `${n} ${n > 1 ? many : one}`;
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const daysFromToday = (days, now = Date.now()) => { const d = new Date(startOfDay(now)); d.setDate(d.getDate() + days); return d.getTime(); };
const fmtTime = m => m === 0 ? "Illimité" : m < 60 ? `${m} min` : m % 60 === 0 ? `${m / 60} h` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}`;
const fmtDate = t => new Date(t).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
const dayDiff = (a, b) => Math.round((startOfDay(a) - startOfDay(b)) / DAY);
const fmtUntil = (t, now) => dayDiff(t, now) <= 1 ? "jusqu'à demain" : `jusqu'au ${fmtDate(t)}`;
const fmtUntilShort = (t, now) => dayDiff(t, now) <= 1 ? "demain" : fmtDate(t);
const fmtAgo = (t, now) => { const d = dayDiff(now, t); return d <= 0 ? "aujourd'hui" : d === 1 ? "hier" : `il y a ${d} jours`; };
const isBlocked = (a, now) => a.blockedUntil != null && a.blockedUntil > now;

const nextColor = i => PALETTE[i % PALETTE.length];

/* Création d'éléments DOM. Le texte passe toujours par des nœuds texte (pas d'injection HTML). */
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") { for (const [sk, sv] of Object.entries(v)) el.style.setProperty(sk, sv); }
    else if (k === "checked" || k === "value") el[k] = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : String(c));
  }
  return el;
}
/* Remplace le contenu d'un élément en ignorant null / false. */
function fill(el, ...children) { el.replaceChildren(...children.flat(Infinity).filter(c => c != null && c !== false).map(c => c instanceof Node ? c : String(c))); }
function icon(name) { const s = h("span", { class: "ico" }); s.innerHTML = ICONS[name]; return s; }

/* ---------- Stockage ---------- */
function readJSON(key) { try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : null; } catch { return null; } }
function writeJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch { return false; } }

/* Nettoie / migre n'importe quelle donnée (v1 = tableau d'activités, v2 = objet complet). Renvoie null si illisible. */
function normActivity(a) {
  if (!a || typeof a !== "object") return null;
  const name = String(a.name ?? "").trim();
  if (!name) return null;
  const tags = Array.isArray(a.tags) ? [...new Set(a.tags.map(t => String(t).trim()).filter(Boolean))] : [];
  return {
    id: a.id != null && a.id !== "" ? String(a.id) : uid(),
    name,
    energy: clampInt(a.energy, 1, 5, 3),
    time: clampInt(a.time, 1, 1440, 30),
    tags,
    weight: clampInt(a.weight, 1, 3, 1),
    cooldownDays: clampInt(a.cooldownDays, 0, 365, 0),
    disabled: !!a.disabled,
    blockedUntil: Number.isFinite(a.blockedUntil) ? a.blockedUntil : null,
    lastDone: Number.isFinite(a.lastDone) ? a.lastDone : null,
    subs: uniqueIds(Array.isArray(a.subs) ? a.subs.map(normSub).filter(Boolean) : []),
  };
}
/* Sous-activité : energy / time à null = hérités de l'activité parente.
   Tags effectifs = (tags du parent − removeTags) + addTags. */
function normSub(x) {
  if (!x || typeof x !== "object") return null;
  const name = String(x.name ?? "").trim();
  if (!name) return null;
  const addTags = normTagList(x.addTags);
  return {
    id: x.id != null && x.id !== "" ? String(x.id) : uid(),
    name,
    energy: clampInt(x.energy, 1, 5, null),
    time: clampInt(x.time, 1, 1440, null),
    addTags,
    removeTags: normTagList(x.removeTags).filter(t => !addTags.includes(t)),
    status: ["todo", "doing", "done"].includes(x.status) ? x.status : null,
    weight: clampInt(x.weight, 1, 3, 1),
    disabled: !!x.disabled,
    lastDone: Number.isFinite(x.lastDone) ? x.lastDone : null,
  };
}
function uniqueIds(list) {
  const seen = new Set();
  for (const x of list) { if (seen.has(x.id)) x.id = uid(); seen.add(x.id); }
  return list;
}
function normTagList(arr) { return Array.isArray(arr) ? [...new Set(arr.map(t => String(t).trim()).filter(Boolean))] : []; }
function normalizeData(raw) {
  let acts, rawTags = [], rawProfiles = [];
  if (Array.isArray(raw)) acts = raw;
  else if (raw && typeof raw === "object" && Array.isArray(raw.activities)) {
    acts = raw.activities;
    rawTags = Array.isArray(raw.tags) ? raw.tags : [];
    rawProfiles = Array.isArray(raw.profiles) ? raw.profiles : [];
  } else return null;

  const activities = [], ids = new Set();
  for (const a of acts) {
    const n = normActivity(a);
    if (!n) continue;
    if (ids.has(n.id)) n.id = uid();
    ids.add(n.id);
    activities.push(n);
  }
  const tagMap = new Map();
  for (const t of rawTags) {
    const name = String((t && typeof t === "object") ? t.name ?? "" : t ?? "").trim();
    if (name && !tagMap.has(name)) tagMap.set(name, { name, color: isColor(t && t.color) ? t.color : null });
  }
  for (const a of activities) for (const t of [...a.tags, ...a.subs.flatMap(x => x.addTags)]) if (!tagMap.has(t)) tagMap.set(t, { name: t, color: null });
  const tags = [...tagMap.values()].map((t, i) => ({ name: t.name, color: t.color || nextColor(i) }));

  const profiles = rawProfiles.filter(p => p && String(p.name ?? "").trim()).map(p => ({
    id: p.id ? String(p.id) : uid(),
    name: String(p.name).trim(),
    energy: clampInt(p.energy, 1, 5, 3),
    time: TIME_OPTIONS.includes(Number(p.time)) ? Number(p.time) : 60,
    include: normTagList(p.include),
    exclude: normTagList(p.exclude),
  }));
  return { activities, tags, profiles };
}
function addMissingTags(d, extra) {
  const names = new Set(d.tags.map(t => t.name));
  return { ...d, tags: [...d.tags, ...extra.filter(t => !names.has(t.name))] };
}
function exampleData() { return normalizeData({ activities: DEFAULT_ACTIVITIES, tags: DEFAULT_TAGS }); }
function loadInitial() {
  const v2 = normalizeData(readJSON(STORE_KEY));
  if (v2) return v2;
  const v1 = normalizeData(readJSON(V1_KEY));
  if (v1) return addMissingTags(v1, DEFAULT_TAGS);
  return exampleData();
}
function sanitizeFilters(f, d) {
  const names = new Set(d.tags.map(t => t.name));
  const include = normTagList(f && f.include).filter(t => names.has(t));
  const exclude = normTagList(f && f.exclude).filter(t => names.has(t) && !include.includes(t));
  return {
    energy: clampInt(f && f.energy, 1, 5, 3),
    time: f && TIME_OPTIONS.includes(Number(f.time)) ? Number(f.time) : 60,
    include, exclude,
  };
}

/* Remplace les données, enregistre, redessine. Avec undoable, le toast propose « Annuler ». */
function commit(next, msg, undoable = false, onUndo = null) {

  data = next;
  filters = sanitizeFilters(filters, data);

}

/* ---------- Logique de sélection ---------- */
/* x = { energy, time, tags } */
function matches(x, f) {
  if (x.energy > f.energy) return false;
  if (f.time && x.time > f.time) return false;
  if (f.exclude.some(t => x.tags.includes(t))) return false;
  if (f.include.length && !f.include.some(t => x.tags.includes(t))) return false;
  return true;
}
function effSub(a, x) {
  return {
    energy: x.energy ?? a.energy,
    time: x.time ?? a.time,
    tags: [...new Set([...a.tags.filter(t => !x.removeTags.includes(t)), ...x.addTags])],
  };
}
const availableSubs = a => a.subs.filter(x => !x.disabled && x.status !== "done");
const eligibleSubs = (a, f) => availableSubs(a).filter(x => matches(effSub(a, x), f));
/* Une activité avec des sous-activités disponibles est possible si au moins une d'elles l'est.
   Sinon (aucune, ou toutes terminées / désactivées), ses propres réglages s'appliquent. */
function isEligible(a, f, now) {
  if (a.disabled || isBlocked(a, now)) return false;
  if (availableSubs(a).length) return eligibleSubs(a, f).length > 0;
  return matches(a, f);
}
function rangeLabel(vals, fmt) { const lo = Math.min(...vals), hi = Math.max(...vals); return lo === hi ? fmt(lo) : `${fmt(lo)}–${fmt(hi)}`; }
function metaText(a, f) {
  const subs = f ? eligibleSubs(a, f) : availableSubs(a);
  if (!subs.length) return `${ENERGY[a.energy].e} ${a.energy} · ${fmtTime(a.time)}`;
  const effs = subs.map(x => effSub(a, x));
  const es = effs.map(e => e.energy), ts = effs.map(e => e.time);
  return `${ENERGY[Math.min(...es)].e} ${rangeLabel(es, String)} · ${rangeLabel(ts, fmtTime)} · ${subs.length} au choix`;
}
function eligibleNow() { const now = Date.now(); return data.activities.filter(a => isEligible(a, filters, now)); }
function weightedPick(list, avoidId) {
  const pool = avoidId && list.length > 1 ? list.filter(a => a.id !== avoidId) : list;
  const total = pool.reduce((s, a) => s + a.weight, 0);
  let r = Math.random() * total;
  for (const a of pool) { r -= a.weight; if (r < 0) return a; }
  return pool[pool.length - 1];
}
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const sameFilters = (p, f) => p.energy === f.energy && p.time === f.time && sameSet(p.include, f.include) && sameSet(p.exclude, f.exclude);
const sortedTags = () => [...data.tags].sort(byName);
const tagColor = name => (data.tags.find(t => t.name === name) || {}).color || "#9aa0a6";
function profileSummary(p) {
  return [`${ENERGY[p.energy].e} ≤ ${p.energy}`, p.time ? `≤ ${fmtTime(p.time)}` : "temps illimité",
    ...p.include.map(t => `+${t}`), ...p.exclude.map(t => `−${t}`)].join(" · ");
}

/* ---------- Bouton « retour » d'Android : ferme la feuille ouverte ---------- */
const overlayStack = [];
let ignorePops = 0, pendingBack = 0, backTimer = null;
addEventListener("popstate", () => {
  if (ignorePops > 0) { ignorePops--; return; }
  const top = overlayStack.pop();
  if (top) top.close(true);
});
function pushOverlay(close) {
  const entry = { close };
  overlayStack.push(entry);
  if (pendingBack > 0) pendingBack--; else history.pushState({ qf: true }, "");
  return entry;
}
function popOverlay(entry, fromBack) {
  const i = overlayStack.indexOf(entry);
  if (i !== -1) overlayStack.splice(i, 1);
  if (fromBack) return;
  pendingBack++;
  if (!backTimer) backTimer = setTimeout(() => {
    const n = pendingBack; pendingBack = 0; backTimer = null;
    if (n > 0) { ignorePops++; history.go(-n); }
  }, 0);
}

/* ---------- Feuille du bas générique ---------- */
let lockCount = 0;
function openSheet({ title, body, footer, onClose, guard }) {
  const backdrop = h("div", { class: "sheet-backdrop" });
  const sheet = h("div", { class: "sheet", role: "dialog", "aria-modal": "true" });
  let closed = false, entry = null;
  const close = (fromBack, force) => {
    if (closed) return;
    if (!force && guard && guard()) {
      if (fromBack === true) entry = pushOverlay(close); // le retour Android a déjà consommé l'entrée d'historique
      confirmBox({ title: "Abandonner les modifications ?", text: "Tes changements ne seront pas enregistrés.", ok: "Abandonner", danger: true, onOk: () => close(false, true) });
      return;
    }
    closed = true;
    popOverlay(entry, fromBack === true);
    if (reducedMotion()) backdrop.remove();
    else { backdrop.classList.add("closing"); setTimeout(() => backdrop.remove(), 220); }
    if (--lockCount <= 0) { lockCount = 0; document.body.classList.remove("lock"); }
    onClose && onClose();
  };
  clearTimeout(toastTimer); toastWrap.replaceChildren();
  backdrop.addEventListener("click", e => { if (e.target === backdrop) close(); });
  const grab = h("div", { class: "sheet-grab" }, h("div", { class: "sheet-handle" }),
    title && h("div", { class: "sheet-head" }, h("h2", null, title), h("button", { class: "icon-btn", "aria-label": "Fermer", onclick: () => close() }, "✕")));
  sheet.append(grab);
  /* Glisser la poignée (ou le titre) vers le bas pour fermer */
  let dragY = null, dy = 0, t0 = 0;
  grab.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    dragY = e.clientY; dy = 0; t0 = performance.now();
    grab.setPointerCapture(e.pointerId);
    sheet.style.transition = "none"; sheet.style.animation = "none";
  });
  grab.addEventListener("pointermove", e => {
    if (dragY == null) return;
    dy = Math.max(0, e.clientY - dragY);
    sheet.style.transform = `translateY(${dy}px)`;
  });
  const endDrag = () => {
    if (dragY == null) return;
    const speed = dy / Math.max(1, performance.now() - t0);
    dragY = null;
    sheet.style.transition = "transform .2s cubic-bezier(.2,.85,.25,1)";
    if (dy > 110 || (dy > 30 && speed > 0.5)) close();
    if (!closed) sheet.style.transform = "";
  };

/* Feuille de résultat : tirage animé, actions, puis choix éventuel d'une sous-activité */
function openResult(initialId) {
  let pickedId = initialId, timer = null;
  let pending = null; // validation en attente, enregistrée à la fermeture : { parentId, subId, status }
  const box = h("div", { class: "result" });
  const s = openSheet({ body: box, onClose: () => { clearTimeout(timer); finalize(); } });

  /* Défilement façon machine à sous : rapide au début, puis ralentit */
  function animate(list, kicker, onEnd) {
    clearTimeout(timer);
    if (reducedMotion() || list.length < 2) { onEnd(); return; }
    const delays = [45, 45, 50, 55, 60, 70, 80, 95, 115, 140, 170, 210];
    let i = 0, last = -1;
    const frame = () => {
      let k = Math.floor(Math.random() * list.length);
      if (k === last) k = (k + 1) % list.length;
      last = k;
      fill(box, h("div", { class: "result-kicker" }, kicker), h("div", { class: "result-name rolling" }, list[k].name));
    };
    const step = () => {
      if (i >= delays.length) { timer = null; if (navigator.vibrate) navigator.vibrate(18); onEnd(); return; }
      timer = setTimeout(() => { frame(); step(); }, delays[i++]);
    };
    frame(); step();
  }

  /* Étape 1 : l'activité */
  function roll(avoidId) {
    const list = eligibleNow();
    if (!list.length) { s.close(); return; }
    const final = weightedPick(list, avoidId);
    animate(list, "Tirage…", () => { pickedId = final.id; show(); });
  }
  function show() {
    const a = data.activities.find(x => x.id === pickedId);
    if (!a) { s.close(); return; }
    const now = Date.now();
    const others = eligibleNow().filter(x => x.id !== a.id).length;
    const withSubs = eligibleSubs(a, filters).length > 0;
    fill(box,
      h("div", { class: "result-kicker" }, "Et si tu faisais…"),
      h("div", { class: "result-name reveal" }, a.name),
      h("div", { class: "result-meta" }, withSubs ? metaText(a, filters) : `${ENERGY[a.energy].e} ${ENERGY[a.energy].l} · ⏱ ${fmtTime(a.time)}`, stars(a.weight)),
      miniTags(a.tags),
      a.lastDone && h("div", { class: "result-meta small" }, `Dernière fois : ${fmtAgo(a.lastDone, now)}`),
      h("button", { class: "btn primary big", onclick: () => markDone(a) }, "C'est parti ✓"),
      h("div", { class: "two" },
        h("button", { class: "btn", disabled: others === 0, onclick: () => roll(a.id) }, "🎲 Une autre"),
        h("button", { class: "btn", onclick: () => notToday(a) }, "Pas aujourd'hui")),
      h("button", { class: "link", onclick: () => openActivityEditor(a, { onSaved: show, onDeleted: () => s.close() }) }, "Modifier cette activité"));
  }
  function markDone(a) {
    pending = { parentId: a.id, subId: null, status: undefined };
    if (availableSubs(a).length) showSubChoice(a, false);
    else s.close();
  }
  function notToday(a) {
    s.close();
    commit({ ...data, activities: data.activities.map(x => x.id === a.id ? { ...x, blockedUntil: daysFromToday(1) } : x) },
      `« ${a.name} » masquée jusqu'à demain`, true);
  }

  /* Étape 2 (facultative) : la sous-activité */
  function showSubChoice(a, showAll) {
    pending.subId = null; pending.status = undefined;
    const elig = eligibleSubs(a, filters).sort(byName);
    const outside = availableSubs(a).filter(x => !elig.includes(x)).sort(byName);
    const list = showAll ? [...elig, ...outside] : elig;
    fill(box,
      h("div", { class: "result-kicker" }, "C'est parti pour"),
      h("div", { class: "result-name medium" }, a.name),
      h("p", { class: "result-meta" }, elig.length ? "Tu veux que je choisisse pour toi ?" : "Aucune ne correspond à tes filtres actuels."),
      elig.length > 0 && h("button", { class: "btn primary big", onclick: () => rollSub(a, null) }, `🎲 Tirer parmi ${elig.length}`),
      list.length > 0 && h("div", { class: "sub-pick" }, list.map(x => subPickItem(a, x, () => { pending.subId = x.id; showSub(a); }))),
      outside.length > 0 && !showAll && h("button", { class: "link", onclick: () => showSubChoice(a, true) },
        `Voir aussi ${plural(outside.length, "autre", "autres")} (hors filtres)`),

  }
  function rollSub(a, avoidId) {
    const list = eligibleSubs(a, filters);
    if (!list.length) { showSubChoice(a, true); return; }
    const final = weightedPick(list, avoidId);
    animate(list, a.name, () => { pending.subId = final.id; pending.status = undefined; showSub(a); });
  }
  function showSub(a) {
    const x = a.subs.find(y => y.id === pending.subId);
    if (!x) { showSubChoice(a, false); return; }
    const e = effSub(a, x);
    const st = pending.status !== undefined ? pending.status : x.status;
    const others = eligibleSubs(a, filters).filter(y => y.id !== x.id).length;
    fill(box,
      h("div", { class: "result-kicker" }, a.name),
      h("div", { class: "result-name reveal" }, x.name),
      h("div", { class: "result-meta" }, `${ENERGY[e.energy].e} ${ENERGY[e.energy].l} · ⏱ ${fmtTime(e.time)}`, stars(x.weight)),
      miniTags(e.tags),
      x.lastDone && h("div", { class: "result-meta small" }, `Dernière fois : ${fmtAgo(x.lastDone, Date.now())}`),
      st != null && h("div", { class: "result-status" }, segmented(STATUS_OPTS.filter(o => o.v), st, v => { pending.status = v; showSub(a); })),
      h("button", { class: "btn primary big", onclick: () => s.close() }, "Parfait ✓"),
      h("div", { class: "two" },
        h("button", { class: "btn", disabled: others === 0, onclick: () => rollSub(a, x.id) }, "🎲 Un autre"),
        h("button", { class: "btn", onclick: () => showSubChoice(a, false) }, "Voir la liste")));
  }

  /* Enregistre la validation (activité + sous-activité éventuelle) quand la feuille se ferme */
  function finalize() {
    if (!pending) return;
    const p = pending; pending = null;
    const a = data.activities.find(x => x.id === p.parentId);
    if (!a) return;
    const now = Date.now();
    const sub = p.subId ? a.subs.find(x => x.id === p.subId) : null;
    const upd = {
      ...a, lastDone: now,
      blockedUntil: a.cooldownDays ? daysFromToday(a.cooldownDays, now) : a.blockedUntil,
      subs: a.subs.map(x => x.id === p.subId ? { ...x, lastDone: now, status: p.status !== undefined ? p.status : x.status } : x),
    };

  const lastTxt = last ? `Dernière sauvegarde : ${fmtAgo(last, now)}` : "Aucune sauvegarde faite pour l'instant";

  return h("div", { class: "screen" },
    h("header", { class: "top" }, h("h1", null, "Réglages")),

    !standalone && h("div", { class: "section-title" }, "Application"),
    !standalone && (installEvt
      ? actionRow("📲", "Installer sur l'écran d'accueil", "S'ouvre comme une vraie app, sans barre de navigateur", doInstall)
      : h("div", { class: "card" }, h("p", { class: "text small" }, "Pour installer : menu ⋮ du navigateur → « Installer » ou « Ajouter à l'écran d'accueil » (Firefox comme Chrome)."))),

    h("div", { class: "section-title" }, "Affichage"),
    h("div", { class: "card" },
      h("div", { class: "card-label" }, "Thème"),
      segmented([{ v: "auto", l: "Auto" }, { v: "light", l: "Clair" }, { v: "dark", l: "Sombre" }], themeSetting(), v => { setTheme(v); render(); }),
      hint("Auto suit le réglage clair / sombre du téléphone.")),

    h("div", { class: "section-title" }, "Profils de filtres"),
    data.profiles.length
      ? h("div", { class: "stack" }, data.profiles.map(p => actionRow("🎛️", p.name, profileSummary(p), () => openProfileEditor(p))))
      : h("div", { class: "card" }, h("p", { class: "text small" }, "Règle tes filtres sur l'écran Choisir, puis touche « ＋ Enregistrer ces filtres comme profil ».")),

    h("div", { class: "section-title" }, "Sauvegarde"),
    h("div", { class: "stack" },
      actionRow("💾", "Exporter un fichier", lastTxt, doDownload),
      actionRow("📤", "Partager la sauvegarde", "Vers Drive, mail, messagerie…", doShare),
      actionRow("📂", "Importer un fichier", "Fichier .json de n'importe quelle version", () => { fileInput.value = ""; fileInput.click(); }),
      actionRow("📋", "Coller une sauvegarde", "Si tu as copié le texte JSON", openPaste)),
    hint("Tes données restent uniquement sur cet appareil. Exporte de temps en temps : si tu vides les données de Chrome ou changes de téléphone, c'est ta seule copie."),

    h("div", { class: "section-title" }, "Données"),
    h("div", { class: "stack" },
      actionRow("➕", "Ajouter les activités d'exemple", "Ajoute seulement celles qui manquent", loadExamples),
      actionRow("🗑️", "Tout effacer", `${plural(data.activities.length, "activité", "activités")}, ${plural(data.tags.length, "tag", "tags")}, ${plural(data.profiles.length, "profil", "profils")}`, () => confirmBox({
        title: "Tout effacer ?", text: "Toutes tes activités, tags et profils seront supprimés de cet appareil.", ok: "Tout effacer", danger: true,
        onOk: () => commit({ activities: [], tags: [], profiles: [] }, "Tout a été effacé", true),
      }), "danger-row")),

    h("p", { class: "footer-note" }, `Bored Boubou Tool v${APP_VERSION}`, h("br"), "Fonctionne hors-ligne · aucune donnée envoyée"));
}
function openProfileEditor(p) {
  const s = openSheet({
    title: p.name,
    body: [h("p", { class: "text" }, profileSummary(p)), h("div", { class: "stack" },
      actionRow("▶️", "Appliquer", "Revenir à l'écran Choisir avec ces filtres", () => { s.close(); setFilters(p); setTab("pick"); }),
      actionRow("🔄", "Remplacer par les filtres actuels", profileSummary(filters), () => {
        s.close();
        commit({ ...data, profiles: data.profiles.map(x => x.id === p.id ? { ...x, ...filters, include: [...filters.include], exclude: [...filters.exclude] } : x) }, "Profil mis à jour", true);
      }),
      actionRow("✏️", "Renommer", null, () => {
        s.close();
        askText({ title: "Renommer le profil", label: "Nom", value: p.name, onOk: name => commit({ ...data, profiles: data.profiles.map(x => x.id === p.id ? { ...x, name } : x) }, "Profil renommé") });
      }),
      actionRow("🗑️", "Supprimer", null, () => { s.close(); commit({ ...data, profiles: data.profiles.filter(x => x.id !== p.id) }, `Profil « ${p.name} » supprimé`, true); }, "danger-row"))],
  });
}
function loadExamples() {
  const ex = exampleData();
  const names = new Set(data.activities.map(a => norm(a.name)));
  const add = ex.activities.filter(a => !names.has(norm(a.name)));
  const next = addMissingTags({ ...data, activities: [...data.activities, ...add] }, DEFAULT_TAGS);
  commit(next, add.length ? `${plural(add.length, "exemple ajouté", "exemples ajoutés")}` : "Les exemples sont déjà là", add.length > 0);
}

/* ---------- Export / import ---------- */
function exportText() {
  return JSON.stringify({ app: "que-faire", version: 3, exportedAt: new Date().toISOString(), activities: data.activities, tags: data.tags, profiles: data.profiles }, null, 2);
}
const exportName = () => `boubou-tool-${new Date().toISOString().slice(0, 10)}.json`;
function markExported() { try { localStorage.setItem(EXPORT_KEY, String(Date.now())); } catch {} render(); }
function doDownload() {
  const url = URL.createObjectURL(new Blob([exportText()], { type: "application/json" }));
  const a = h("a", { href: url, download: exportName() });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  markExported();
  showToast("Sauvegarde téléchargée");
}
async function doShare() {
  const text = exportText();
  try {
    const file = new File([text], exportName(), { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Sauvegarde Bored Boubou Tool" }); markExported(); return; }
    if (navigator.share) { await navigator.share({ title: "Sauvegarde Bored Boubou Tool", text }); markExported(); return; }
    await navigator.clipboard.writeText(text); markExported(); showToast("Sauvegarde copiée dans le presse-papiers");
  } catch (e) {
    if (e && e.name === "AbortError") return;
    try { await navigator.clipboard.writeText(text); showToast("Partage impossible — sauvegarde copiée"); } catch { showToast("Partage impossible sur cet appareil"); }
  }
}
fileInput.addEventListener("change", () => {
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => handleImportText(String(reader.result));
  reader.onerror = () => showToast("Impossible de lire le fichier");
  reader.readAsText(file);
});
function handleImportText(text) {
  let parsed;
  try { parsed = JSON.parse(text.replace(/^﻿/, "")); } catch { showToast("Fichier illisible : ce n'est pas du JSON valide"); return; }
  const inc = normalizeData(parsed);
  if (!inc) { showToast("Format non reconnu"); return; }
  if (!inc.activities.length && !inc.tags.length && !inc.profiles.length) { showToast("Le fichier ne contient aucune donnée"); return; }
  openImportPreview(inc);
}
function openImportPreview(inc) {
  const s = openSheet({
    title: "Importer",
    body: [h("p", { class: "text" }, `Ce fichier contient ${plural(inc.activities.length, "activité", "activités")}, ${plural(inc.tags.length, "tag", "tags")} et ${plural(inc.profiles.length, "profil", "profils")}.`),
      h("div", { class: "stack" },
        actionRow("➕", "Fusionner", "Ajoute ce qui manque et garde tes données actuelles", () => {
          s.close();
          const r = mergeData(data, inc);
          commit(r.data, `${plural(r.added, "activité ajoutée", "activités ajoutées")}${r.skipped ? ` · ${r.skipped} déjà présente${r.skipped > 1 ? "s" : ""}` : ""}`, true);
        }),
        actionRow("♻️", "Remplacer tout", "Efface tes données actuelles et met celles du fichier", () => {
          s.close();
          commit(inc, "Données remplacées", true);
        }, "danger-row"))],
  });
}
function mergeData(cur, inc) {
  const names = new Set(cur.activities.map(a => norm(a.name)));
  const ids = new Set(cur.activities.map(a => a.id));
  const added = [];
  let skipped = 0;
  for (const a of inc.activities) {
    const k = norm(a.name);
    if (names.has(k)) { skipped++; continue; }
    names.add(k);
    added.push(ids.has(a.id) ? { ...a, id: uid() } : a);
  }
  const tagNames = new Set(cur.tags.map(t => t.name));
  const profNames = new Set(cur.profiles.map(p => p.name));
  return {
    data: {
      activities: [...cur.activities, ...added],
      tags: [...cur.tags, ...inc.tags.filter(t => !tagNames.has(t.name))],
      profiles: [...cur.profiles, ...inc.profiles.filter(p => !profNames.has(p.name)).map(p => ({ ...p, id: uid() }))],
    },
    added: added.length, skipped,
  };
}
function openPaste() {
  let okBtn;
  const ta = h("textarea", { class: "input", placeholder: "Colle ici le contenu de ta sauvegarde…", spellcheck: "false" });
  const s = openSheet({
    title: "Coller une sauvegarde", body: ta,
    footer: close => [h("button", { class: "btn", onclick: () => close() }, "Annuler"),
      okBtn = h("button", { class: "btn primary", disabled: true, onclick: () => { const t = ta.value; s.close(); handleImportText(t); } }, "Continuer")],
  });
  ta.addEventListener("input", () => { okBtn.disabled = !ta.value.trim(); });
}

/* ---------- Installation (PWA) ---------- */
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; render(); });
addEventListener("appinstalled", () => { installEvt = null; showToast("Application installée"); render(); });
async function doInstall() {
  if (!installEvt) return;
  const evt = installEvt;
  installEvt = null;
  evt.prompt();
  try { await evt.userChoice; } catch {}
  render();
}

/* ---------- Démarrage ---------- */
applyTheme();
persist(); // enregistre tout de suite (migration v1 → v2 incluse)
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
const quietRender = () => { if (!document.querySelector(".main input:focus")) render(); };
setInterval(quietRender, 60000); // les blocages expirent tout seuls
document.addEventListener("visibilitychange", () => { if (!document.hidden) quietRender(); });
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
